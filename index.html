    // ── Animação ao clicar ────────────────────────────────────────────────
    let kicking = false;

    // Posição inicial da bola
    const ballStartX = 95;
    const ballStartY = 225;

    function kick() {
      if (kicking) return;
      kicking = true;

      const leg = d3.select("#leg");
      const ball = d3.select("#ball");

      // Reset bola para posição inicial
      ball.attr("transform", "translate(" + ballStartX + ", " + ballStartY + ")");

      // 1. Puxa perna para trás
      leg.transition()
        .duration(200)
        .ease(d3.easeQuadIn)
        .attr("transform", "translate(" + pivotX + ", " + pivotY + ") rotate(-35)")

      // 2. Chuta para frente
      .transition()
        .duration(150)
        .ease(d3.easeQuadOut)
        .attr("transform", "translate(" + pivotX + ", " + pivotY + ") rotate(40)")
        .on("start", function() {
          // Dispara a bola no momento do chute
          ball.transition()
            .duration(600)
            .ease(d3.easeQuadOut)
            .attrTween("transform", function() {
              return function(t) {
                const x = ballStartX - t * 400;
                const y = ballStartY - Math.sin(t * Math.PI) * 120;
                const rot = t * 720;
                return "translate(" + x + ", " + y + ") rotate(" + rot + ", 0, 0)";
              };
            })
            .transition()
            .duration(400)
            .ease(d3.easeQuadIn)
            .attrTween("transform", function() {
              return function(t) {
                const x = ballStartX - 400 - t * 100;
                const y = ballStartY - Math.sin((1 - t) * Math.PI * 0.3) * 30;
                return "translate(" + x + ", " + y + ")";
              };
            })
            .on("end", function() {
              // Volta bola à posição inicial suavemente
              setTimeout(function() {
                ball.transition()
                  .duration(600)
                  .ease(d3.easeCubicInOut)
                  .attr("transform", "translate(" + ballStartX + ", " + ballStartY + ")");
              }, 500);
            });
        })

      // 3. Volta ao repouso com efeito elástico
      .transition()
        .duration(400)
        .ease(d3.easeElasticOut.amplitude(1.2).period(0.5))
        .attr("transform", "translate(" + pivotX + ", " + pivotY + ") rotate(0)")
        .on("end", function() { kicking = false; });
    }
